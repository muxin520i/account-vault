name: Build Android APK
# Push to main / PR: build + test only, the APK is kept as an Actions artifact (no release, no branch).
# Releases are made by release.yml, which calls this workflow with a version (2.1, 2.2, ...).

on:
  workflow_dispatch:
  pull_request:
    paths: ['android/**', 'icons/**', '.github/workflows/android.yml']
  push:
    branches: [main]
    paths: ['android/**', 'icons/**', '.github/workflows/android.yml']
  workflow_call:
    inputs:
      version:
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: android-${{ inputs.version || github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Version (versionName = release version, versionCode = commit count + 1000, always increasing)
        run: |
          echo "BUILD=$(( $(git rev-list --count HEAD) + 1000 ))" >> "$GITHUB_ENV"
          echo "VERSION=${{ inputs.version || 'dev' }}" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore signing key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          test -n "$KS_B64" || { echo "::error::ANDROID_KEYSTORE_B64 secret missing"; exit 1; }
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/atlas.jks"
      - name: Test + build signed release APK
        working-directory: android
        env:
          ATLAS_KEYSTORE: ${{ runner.temp }}/atlas.jks
          ATLAS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ATLAS_BUILD: ${{ env.BUILD }}
          ATLAS_VERSION: ${{ env.VERSION }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace testReleaseUnitTest assembleRelease
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/Atlas.apk"
          ls -la "$GITHUB_WORKSPACE/Atlas.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Atlas-apk
          path: Atlas.apk

  # emulator screenshots: only when run by hand (Actions -> Run workflow)
  shots:
    needs: apk
    if: ${{ github.event_name == 'workflow_dispatch' && !inputs.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Atlas-apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash android/ci/shots.sh Atlas.apk shots
      - name: Keep screenshots as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-shots
          path: shots/
          retention-days: 14
          if-no-files-found: ignore
