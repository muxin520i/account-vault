<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="账号仓库" />
  <meta name="description" content="每个邮箱和手机号注册了哪些网站与 App，一眼看清" />
  <title>账号仓库</title>
  <script>try{if(localStorage.getItem("atlas.theme")==="light"){document.documentElement.dataset.theme="light";document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]').content="default";document.querySelector('meta[name="theme-color"]').content="#f2f2f7"}}catch(e){}</script>
  <link rel="icon" href="logo.svg?v=4" type="image/svg+xml" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon.png?v=4" />
  <link rel="stylesheet" href="styles.css?v=2" />
  <link rel="stylesheet" href="vault.css?v=2" />
</head>
<body>
  <div class="glow" id="glow"></div>

  <header class="top" id="top">
    <div class="top-bar">
      <div class="top-title" id="topTitle">账号</div>
      <div class="top-actions">
        <button class="round theme-btn" id="themeBtn" data-act="theme" aria-label="切换深浅色"><svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></svg><svg class="moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg></button>
        <button class="round" id="openSearch" aria-label="搜索"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4-4"/></svg></button>
        <button class="round" id="addBtn" aria-label="添加"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
      </div>
    </div>
    <div class="menu" id="menu" role="menu">
      <button data-act="sync"><span>加密同步<small>未开启</small></span><svg viewBox="0 0 24 24"><path d="M7 18a4.5 4.5 0 0 1-.6-8.96A6 6 0 0 1 18 9a4 4 0 0 1-.5 9H7Z"/></svg></button>
      <div class="menu-sep"></div>
      <button data-act="order"><span>调整卡片顺序</span><svg viewBox="0 0 24 24"><path d="M7 4v16M3.5 7.5 7 4l3.5 3.5M17 20V4M13.5 16.5 17 20l3.5-3.5"/></svg></button>
      <button data-act="privacy"><span>隐藏号码</span><svg viewBox="0 0 24 24"><path d="M3 12s3.5-6 9-6 9 6 9 6-3.5 6-9 6-9-6-9-6Z"/><circle cx="12" cy="12" r="2.5"/></svg></button>
      <button data-act="export"><span>导出备份</span><svg viewBox="0 0 24 24"><path d="M12 15V3M7 8l5-5 5 5M5 14v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/></svg></button>
      <button data-act="import"><span>导入备份</span><svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M5 14v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/></svg></button>
      <button data-act="changepw"><span>修改密码</span><svg viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="11" rx="2.5"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg></button>
      <button data-act="lock"><span>立即锁定</span><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></button>
      <button data-act="demo"><span>载入示例</span><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg></button>
      <div class="menu-sep"></div>
      <button data-act="quickunlock"><span>免密启动<small>已关闭</small></span><svg viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="11" rx="2.5"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg></button>
    </div>
  </header>

  <main>
    <!-- 首页 -->
    <section class="view active" data-view="home">
      <div class="hello">
        <h1 class="large">账号</h1>
        <p class="summary" id="summary"></p>
      </div>
      <div class="kind-seg" id="kindSeg" hidden></div>
      <div class="wallet" id="wallet"></div>
      <div class="dots" id="dots"></div>

      <div class="block">
        <div class="block-head"><div><h2 id="gridTitle"></h2><p class="block-sub" id="gridSub"></p></div><button class="pill-btn" id="gridAdd"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>添加</button></div>
        <div class="panel"><div class="grid" id="grid"></div></div>
      </div>

      <div class="block">
        <div class="block-head"><div><h2>最近添加</h2><p class="block-sub">按时间排列</p></div></div>
        <div class="timeline" id="timeline"></div>
      </div>
    </section>

    <!-- 全部网站 -->
    <section class="view" data-view="sites">
      <div class="hello"><h1 class="large">网站与 App</h1><p class="summary" id="sitesSummary"></p></div>
      <div class="filters" id="filters"></div>
      <div id="siteList"></div>
    </section>

    <!-- 星图 -->
    <section class="view" data-view="graph">
      <div class="hello"><h1 class="large">关系图</h1><p class="summary" id="graphSummary"></p></div>
      <div class="map" id="mapBox"></div>
      <p class="map-tip" id="mapTip">点一张卡片，只看它连着的；再点一下打开详情。</p>
    </section>

    <p class="footnote" id="footnote"></p>
  </main>

  <nav class="tabbar" id="tabbar">
    <span class="tab-thumb" id="tabThumb"></span>
    <button class="active" data-tab="home" aria-label="卡包"><svg class="o" viewBox="0 0 24 24"><path d="M7 4.2h10M5 6.9h14"/><rect x="3" y="9.6" width="18" height="10.6" rx="2.8"/><path d="M3 13.4h18"/></svg><svg class="f" viewBox="0 0 24 24"><path d="M7 4.2h10M5 6.9h14" opacity=".55"/><path class="fl" fill-rule="evenodd" d="M5.8 9.6h12.4a2.8 2.8 0 0 1 2.8 2.8v5a2.8 2.8 0 0 1-2.8 2.8H5.8A2.8 2.8 0 0 1 3 17.4v-5a2.8 2.8 0 0 1 2.8-2.8ZM3 12.6v1.6h18v-1.6Z"/></svg></button>
    <button data-tab="sites" aria-label="全部 App"><svg class="o" viewBox="0 0 24 24"><rect x="3.6" y="3.6" width="7.2" height="7.2" rx="2.2"/><rect x="13.2" y="3.6" width="7.2" height="7.2" rx="2.2"/><rect x="3.6" y="13.2" width="7.2" height="7.2" rx="2.2"/><rect x="13.2" y="13.2" width="7.2" height="7.2" rx="2.2"/></svg><svg class="f" viewBox="0 0 24 24"><rect class="fl" x="3.2" y="3.2" width="8" height="8" rx="2.4"/><rect class="fl" x="12.8" y="3.2" width="8" height="8" rx="2.4"/><rect class="fl" x="3.2" y="12.8" width="8" height="8" rx="2.4"/><rect class="fl" x="12.8" y="12.8" width="8" height="8" rx="2.4"/></svg></button>
    <button data-tab="graph" aria-label="关系图"><svg class="o" viewBox="0 0 24 24"><path class="dot" d="M10.4 7.6 6.2 15.4M13.6 7.6l4.2 7.8M7.6 18.6h8.8"/><circle cx="12" cy="5" r="2.6"/><circle cx="4.8" cy="18.6" r="2.6"/><circle cx="19.2" cy="18.6" r="2.6"/></svg><svg class="f" viewBox="0 0 24 24"><path class="dot" d="M10.4 7.6 6.2 15.4M13.6 7.6l4.2 7.8M7.6 18.6h8.8"/><circle class="fl" cx="12" cy="5" r="3.2"/><circle class="fl" cx="4.8" cy="18.6" r="3.2"/><circle class="fl" cx="19.2" cy="18.6" r="3.2"/></svg></button>
    <button id="menuBtn" aria-label="设置"><svg viewBox="0 0 24 24"><circle cx="6" cy="12" r="1.6" class="fl"/><circle cx="12" cy="12" r="1.6" class="fl"/><circle cx="18" cy="12" r="1.6" class="fl"/></svg></button>
  </nav>

  <div class="scrim" id="scrim"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="grabber"></div><div class="sheet-inner" id="sheetInner"></div></div>

  <div class="spot-layer" id="spotLayer">
    <div class="spot">
      <div class="spot-field">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4-4"/></svg>
        <input id="spotInput" placeholder="网站名、邮箱，或号码后四位" autocomplete="off" enterkeyhint="search" />
        <button class="spot-cancel" id="spotCancel">取消</button>
      </div>
      <div class="spot-results" id="spotResults"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <input type="file" id="fileInput" accept="application/json" hidden />
  <script src="vault.js?v=2"></script>
  <script src="app.js?v=2"></script>
<script>if("serviceWorker" in navigator&&location.protocol.startsWith("http"))addEventListener("load",()=>navigator.serviceWorker.register("sw.js"));</script>
</body>
</html>
