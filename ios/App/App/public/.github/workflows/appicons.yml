name: App Store icons
on:
  push:
    branches: [none]
    paths: [tools/appicons.json, tools/appicons.py]
  workflow_dispatch:
permissions: { contents: write }
jobs:
  fetch:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/appicons.py
      - run: |
          git config user.name Ckxkx; git config user.email 138646608+Ckxkx@users.noreply.github.com
          git add icons tools/appicons.log && git commit -m "icons: official App Store artwork" && git push
