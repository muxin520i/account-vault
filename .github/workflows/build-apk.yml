name: 编译原生 Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-native-build
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          test -n "$KS_B64" || { echo "::error::signing key secret missing"; exit 1; }
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/accountvault.jks"

      - name: Build signed native APK
        working-directory: android
        env:
          ATLAS_KEYSTORE: ${{ runner.temp }}/accountvault.jks
          ATLAS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ATLAS_BUILD: 28
          ATLAS_VERSION: 2.9
        run: |
          ./gradlew --no-daemon assembleRelease
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/account-vault-native-v2.9.apk"

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.9
          name: 账号仓库 v2.9（同步上游v2.3.3：QQ登录卡/图标匹配修复/数据容错保护/AppStore搜索增强，EXE同步更新）
          files: account-vault-native-v2.9.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
