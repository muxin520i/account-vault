name: 编译原生 iOS IPA

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-native-build
  cancel-in-progress: false

jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Build unsigned native IPA
        run: |
          set -euo pipefail
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          APP=build/Payload/AccountVault.app
          mkdir -p "$APP" build
          xcrun -sdk iphoneos swiftc -parse-as-library -O -swift-version 5 \
            -target arm64-apple-ios17.0 -sdk "$SDK" native/*.swift -o "$APP/AccountVault" 2>&1 | tee build/swiftc.log
          test -f "$APP/AccountVault"
          cp -R icons "$APP/icons"
          cp -R native/lproj/*.lproj "$APP/"
          for f in "$APP"/*.lproj/InfoPlist.strings; do plutil -convert binary1 "$f"; done
          BUILD=20
          sed -e "s/__VERSION__/2.0/" -e "s/__BUILD__/$BUILD/" native/Info.plist > "$APP/Info.plist"
          xcrun actool Assets.xcassets --compile "$APP" --platform iphoneos --minimum-deployment-target 17.0 \
            --app-icon AppIcon --output-partial-info-plist build/partial.plist --target-device iphone
          /usr/libexec/PlistBuddy -c "Merge build/partial.plist" "$APP/Info.plist"
          for k in DTPlatformName:iphoneos DTSDKName:iphoneos$(xcrun --sdk iphoneos --show-sdk-version); do
            /usr/libexec/PlistBuddy -c "Add :${k%%:*} string ${k#*:}" "$APP/Info.plist"; done
          plutil -convert binary1 "$APP/Info.plist"
          echo -n 'APPL????' > "$APP/PkgInfo"
          cd build && zip -qX -D ../AccountVault-unsigned.ipa "Payload/AccountVault.app/Info.plist" \
            && zip -qrXy ../AccountVault-unsigned.ipa Payload -x "Payload/AccountVault.app/Info.plist" && cd ..
          test "$(unzip -Z1 AccountVault-unsigned.ipa | head -1)" = "Payload/AccountVault.app/Info.plist"
          ls -la AccountVault-unsigned.ipa; file "$APP/AccountVault"

      - name: Upload IPA to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0
          name: 账号仓库 真原生版 v2.0
          files: AccountVault-unsigned.ipa
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
