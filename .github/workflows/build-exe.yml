name: 编译 Windows EXE（网页套壳便携版）

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: exe-build
  cancel-in-progress: false

jobs:
  exe:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: electron
        run: npm install

      - name: Build portable EXE (electron-builder)
        working-directory: electron
        run: npx electron-builder --win portable --x64

      - name: Rename and stage
        run: |
          $exe = Get-ChildItem electron/dist/*.exe | Where-Object { $_.Name -notlike '*unpacked*' } | Select-Object -First 1
          Write-Host "Built: $($exe.FullName) ($($exe.Length) bytes)"
          Copy-Item $exe.FullName account-vault-web-v3.0.exe

      - name: Upload EXE to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0
          name: 账号仓库 v3.0（同步上游v2.4安全项：QQ企鹅图标/成人App过滤/复制账号60秒清剪贴板/短号显示容错；README删下载与编译说明）
          files: account-vault-web-v3.0.exe
          fail_on_unmatched_files: true
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
